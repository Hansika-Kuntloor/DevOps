<!DOCTYPE html>
<html>
<head>
<title>User Registration Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    background:white;
    width:350px;
    padding:20px;
    border:1px solid #888;
    border-radius:10px;
    box-shadow:0 0 8px #ccc;
}

h2{
    text-align:center;
    margin-bottom:15px;
}

label{
    display:block;
    margin-top:10px;
    font-weight:bold;
}

input{
    width:100%;
    padding:8px;
    margin:8px 0;
}

input[type="submit"]{
    background:blue;
    color:white;
    border:none;
    cursor:pointer;
    padding:10px;
}

input[type="submit"]:hover{
    background:darkblue;
}

#msg{
    text-align:center;
    color:green;
    margin-top:10px;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h2>User Registration Form</h2>

<form id="myForm">

<label>First Name</label>
<input type="text" id="fname">

<label>Last Name</label>
<input type="text" id="lname">

<label>Roll Number</label>
<input type="text" id="roll">

<label>Email</label>
<input type="text" id="email">

<label>Phone Number</label>
<input type="text" id="phone">

<label>Alternate Phone Number</label>
<input type="text" id="altphone">

<input type="submit" value="Register">

<p id="msg"></p>

</form>

</div>

<script>

document.getElementById("myForm").onsubmit = function(e){

e.preventDefault();

var fname = document.getElementById("fname").value;
var lname = document.getElementById("lname").value;
var roll = document.getElementById("roll").value;
var email = document.getElementById("email").value;
var phone = document.getElementById("phone").value;
var altphone = document.getElementById("altphone").value;

if(fname==""){
    alert("Enter First Name");
    return;
}

if(lname==""){
    alert("Enter Last Name");
    return;
}

if(roll==""){
    alert("Enter Roll Number");
    return;
}

if(email==""){
    alert("Enter Email");
    return;
}

if(email.indexOf("@")==-1 || email.indexOf(".")==-1){
    alert("Enter Valid Email");
    return;
}

if(phone.length!=10 || isNaN(phone)){
    alert("Enter Valid Phone Number");
    return;
}

if(altphone!="" && (altphone.length!=10 || isNaN(altphone))){
    alert("Enter Valid Alternate Phone Number");
    return;
}

if(altphone!="" && phone==altphone){
    alert("Phone Number and Alternate Phone Number should be different");
    return;
}

document.getElementById("msg").innerHTML="Registration Successful!";

document.getElementById("myForm").reset();

}

</script>

</body>
</html>
